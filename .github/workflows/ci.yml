name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest -v

      - name: Compile Python sources
        run: python3 -m py_compile usb_boards.py serial_monitor.py test_usb_boards.py

      - name: Check installer shell syntax
        run: bash -n install.sh
